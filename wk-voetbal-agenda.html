function cn(name) { return lang === 'en' && countryEN[name] ? countryEN[name] : name; }

function translateTeam(name) {
    if (lang === 'nl') return name;
    const l = i18n.en;
    let m;
    if ((m = name.match(/^Eerste (.+)$/))) return l.first + ' ' + m[1];
    if ((m = name.match(/^Tweede (.+)$/))) return l.second + ' ' + m[1];
    if ((m = name.match(/^Beste 3e (.+)$/))) return l.best3rd + ' ' + m[1];

    if ((m = name.match(/^Verliezer (\d+)$/))) return l.loser + ' ' + m[1];
    return cn(name);
}

function formatDay(dateStr) {
    const d = new Date(dateStr + 'T12:00:00');
    return t('days')[d.getDay()] + ' ' + d.getDate() + ' ' + t('months')[d.getMonth()];
}

function getPhaseIdx(e) {
    if (!e.matchNr) return 0;
    if (e.matchNr <= 88) return 1;
    if (e.matchNr <= 96) return 2;
    if (e.matchNr <= 100) return 3;
    if (e.matchNr <= 102) return 4;
    if (e.matchNr === 103) return 5;
    return 6;
}

function getPhase(e) { return i18n.nl.phases[getPhaseIdx(e)]; }

    if (e.group) return { label: t('group') + ' ' + e.group, cls: 'tag-' + e.group };

const pathCache = {};
function getKnockoutPaths(group) {
    if (!group) return { first: new Set(), second: new Set(), third: new Set() };
    if (pathCache[group]) return pathCache[group];

    const firstEntry = new Set(), secondEntry = new Set(), thirdEntry = new Set();
    for (const [nr, src] of Object.entries(r32Sources)) {
        const mn = parseInt(nr);
        for (const side of [src.home, src.away]) {
            if (side.pos === 1 && side.group === group) firstEntry.add(mn);
            if (side.pos === 2 && side.group === group) secondEntry.add(mn);
            if (side.pos === 3 && side.groups && side.groups.includes(group)) thirdEntry.add(mn);
        }
    }

    function traceForward(entrySet) {
        const all = new Set(entrySet);
        let current = [...entrySet];
        while (current.length > 0) {
            const next = [];
            for (const [nr, sources] of Object.entries(bracketTree)) {
                const mn = parseInt(nr);
                if (!all.has(mn) && sources.some(s => all.has(s))) {
                    all.add(mn);
                    next.push(mn);
                }
            }
            current = next;
        }
        return all;
    }

    const result = {
        first: traceForward(firstEntry),
        second: traceForward(secondEntry),
        third: traceForward(thirdEntry)
    };
    pathCache[group] = result;
    return result;
}

function getGCalUrl(e) {
    const [h, m] = e.time.split(':');
    const start = new Date(e.date + 'T' + h.padStart(2,'0') + ':' + m.padStart(2,'0') + ':00');
    const end = new Date(start.getTime() + MATCH_DURATION_MS);
    const fmt = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const phase = getPhaseTag(e).label;
    const homeD = e.group ? cn(e.home) : translateTeam(e.home);
    const awayD = e.group ? cn(e.away) : translateTeam(e.away);
    const info = e.group ? ' (' + t('group') + ' ' + e.group + ')' : ' (' + phase + ')';
    const title = t('calPrefix') + ': ' + homeD + ' - ' + awayD + info;
    const loc = cityName(e.city) + ', ' + cn(cityCountry[e.city] || 'Verenigde Staten');
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(title) + '&dates=' + fmt(start) + '/' + fmt(end) + '&details=' + encodeURIComponent(t('calDetail') + '\n' + t('calCity') + ': ' + loc) + '&location=' + encodeURIComponent(loc);
}

function toICSDate(date, time) {
    const [h, m] = time.split(':');
    return date.replace(/-/g, '') + 'T' + h.padStart(2,'0') + m.padStart(2,'0') + '00';
}

function computeEndICS(date, time) {
    const [h, m] = time.split(':');
    const start = new Date(date + 'T' + h.padStart(2,'0') + ':' + m.padStart(2,'0') + ':00');
    const end = new Date(start.getTime() + MATCH_DURATION_MS);
    const pad = n => String(n).padStart(2, '0');
    return end.getFullYear() + pad(end.getMonth()+1) + pad(end.getDate()) + 'T' + pad(end.getHours()) + pad(end.getMinutes()) + '00';
}

function escapeICS(str) {
    return str.replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
}

function icsLine(line) { return line + '\r\n'; }

function generateICS(indices) {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const dtstamp = now.getUTCFullYear() + pad(now.getUTCMonth()+1) + pad(now.getUTCDate()) + 'T' + pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + 'Z';

    let ics = '';
    ics += icsLine('BEGIN:VCALENDAR');
    ics += icsLine('VERSION:2.0');
    ics += icsLine('PRODID:-//WK Voetbal 2026//NL');
    ics += icsLine('CALSCALE:GREGORIAN');
    ics += icsLine('X-WR-CALNAME:WK Voetbal 2026');
    ics += icsLine('X-WR-TIMEZONE:Europe/Amsterdam');
    ics += icsLine('BEGIN:VTIMEZONE');
    ics += icsLine('TZID:Europe/Amsterdam');
    ics += icsLine('BEGIN:STANDARD');
    ics += icsLine('DTSTART:19701025T030000');
    ics += icsLine('RRULE:FREQ=YEARLY;BYDAY=-1SU;BYMONTH=10');
    ics += icsLine('TZOFFSETFROM:+0200');
    ics += icsLine('TZOFFSETTO:+0100');
    ics += icsLine('TZNAME:CET');
    ics += icsLine('END:STANDARD');
    ics += icsLine('BEGIN:DAYLIGHT');
    ics += icsLine('DTSTART:19700329T020000');
    ics += icsLine('RRULE:FREQ=YEARLY;BYDAY=-1SU;BYMONTH=3');
    ics += icsLine('TZOFFSETFROM:+0100');
    ics += icsLine('TZOFFSETTO:+0200');
    ics += icsLine('TZNAME:CEST');
    ics += icsLine('END:DAYLIGHT');
    ics += icsLine('END:VTIMEZONE');

    indices.forEach(idx => {
        const e = events[idx];
        const phase = getPhaseTag(e).label;
        const homeD = e.group ? cn(e.home) : translateTeam(e.home);
        const awayD = e.group ? cn(e.away) : translateTeam(e.away);
        const info = e.group ? ' (' + t('group') + ' ' + e.group + ')' : ' (' + phase + ')';
        const uid = 'wk2026-' + e.date + '-' + e.time.replace(':','') + '-' + idx + '@olympical.nl';
        const summary = escapeICS(t('calPrefix') + ': ' + homeD + ' - ' + awayD + info);
        const loc = cityName(e.city) + ', ' + cn(cityCountry[e.city] || 'Verenigde Staten');
        const description = escapeICS(t('calDetail') + '\\n' + t('calCity') + ': ' + loc);

        ics += icsLine('BEGIN:VEVENT');
        ics += icsLine('UID:' + uid);
        ics += icsLine('DTSTAMP:' + dtstamp);
        ics += icsLine('DTSTART;TZID=Europe/Amsterdam:' + toICSDate(e.date, e.time));
        ics += icsLine('DTEND;TZID=Europe/Amsterdam:' + computeEndICS(e.date, e.time));
        ics += icsLine('SUMMARY:' + summary);
        ics += icsLine('DESCRIPTION:' + description);
        ics += icsLine('LOCATION:' + escapeICS(loc));
        ics += icsLine('STATUS:CONFIRMED');
        ics += icsLine('END:VEVENT');
    });

    ics += icsLine('END:VCALENDAR');
    return ics;
}

function downloadICS() {
    const selected = [...selectedEvents].sort((a,b) => a - b);
    if (selected.length === 0) return;
    const icsContent = generateICS(selected);
    const blob = new Blob([icsContent], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'WK Voetbal 2026.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function downloadSingleICS(idx) {
    const e = events[idx];
    const icsContent = generateICS([idx]);
    const blob = new Blob([icsContent], { type: 'text/calendar' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const homeD = e.group ? cn(e.home) : translateTeam(e.home);
    const awayD = e.group ? cn(e.away) : translateTeam(e.away);
    a.download = t('calPrefix') + ' ' + homeD + ' - ' + awayD + '.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
}

function updateCount() {
    const count = selectedEvents.size;
    document.getElementById('floatingCount').textContent = count + ' ' + t('selected');
    document.getElementById('floatingBar').classList.toggle('visible', count > 0);
    const sg = document.getElementById('selectGroups');
    if (sg) {
        const groupIdxs = events.map((e,i) => e.group ? i : -1).filter(i => i >= 0);
        const visibleGroupIdxs = groupIdxs.filter(i => document.querySelector('input[data-idx="' + i + '"]'));
        sg.checked = visibleGroupIdxs.length > 0 && visibleGroupIdxs.every(i => selectedEvents.has(i));
    }
    const sf = document.getElementById('selectFinals');
    if (sf) {
        const finalIdxs = events.map((e,i) => e.matchNr ? i : -1).filter(i => i >= 0);
        const visibleFinalIdxs = finalIdxs.filter(i => document.querySelector('input[data-idx="' + i + '"]'));
        sf.checked = visibleFinalIdxs.length > 0 && visibleFinalIdxs.every(i => selectedEvents.has(i));
    }
}

function toggleEvent(idx, evt) {
    if (evt.target.tagName === 'A') return;
    if (selectedEvents.has(idx)) selectedEvents.delete(idx);
    else selectedEvents.add(idx);
    const cb = document.querySelector('input[data-idx="' + Number(idx) + '"]');
    if (cb) cb.checked = selectedEvents.has(idx);
    updateCount();
}

function renderEvents() {
    const container = document.getElementById('eventList');
    let paths = null;
    const countryGroup = selectedCountry ? countryToGroup[selectedCountry] : null;
    if (countryGroup) paths = getKnockoutPaths(countryGroup);

    let filtered = events.map((e, i) => ({ ...e, idx: i, phase: getPhase(e) }));

    if (activePhaseFilters.size > 0) {
        filtered = filtered.filter(e => activePhaseFilters.has(e.phase));
    }
    if (selectedCountry && paths) {
        filtered = filtered.filter(e => {
            if (e.phase === 'Groepsfase') {
                return e.home === selectedCountry || e.away === selectedCountry;
            }
            if (e.matchNr) {
                if (paths.first.has(e.matchNr) || paths.second.has(e.matchNr)) return true;
                if (showThirdPaths && paths.third.has(e.matchNr)) return true;
            }
            return false;
        });
    }

    if (filtered.length === 0) {
        container.innerHTML = '<div class="no-results">' + escapeHTML(t('noResults')) + '</div>';
        return;
    }

    const grouped = {};
    filtered.forEach(e => {
        const day = formatDay(e.date);
        if (!grouped[day]) grouped[day] = [];
        grouped[day].push(e);
    });

    let html = '';
    let currentSection = null;
    for (const [day, dayEvents] of Object.entries(grouped)) {
        const firstPhase = dayEvents[0].phase;
        const section = firstPhase === 'Groepsfase' ? 'group' : 'finals';
        if (section !== currentSection) {
            if (section === 'group') {
                html += '<div class="section-header">' +
                    '<span class="section-title">' + escapeHTML(t('groupStage')) + '</span>' +
                    '<div class="section-select"><input type="checkbox" id="selectGroups" onchange="toggleSection(\'group\', this.checked)">' +
                    '<label for="selectGroups">' + escapeHTML(t('selectAllGroup')) + '</label></div></div>';
            } else {
                html += '<div class="section-header">' +
                    '<span class="section-title">' + escapeHTML(t('knockout')) + '</span>' +
                    '<div style="width:100%;text-align:center;font-size:0.8em;color:#7a8ba3;margin-top:-2px;">' + escapeHTML(t('knockoutNote')) + '</div>' +
                    '<div class="section-select"><input type="checkbox" id="selectFinals" onchange="toggleSection(\'finals\', this.checked)">' +
                    '<label for="selectFinals">' + escapeHTML(t('selectAllFinals')) + '</label></div></div>';
            }
            currentSection = section;
        }
        html += '<div class="day-group"><div class="day-header">' + escapeHTML(day) + '</div>';
        dayEvents.forEach(e => {
            const checked = selectedEvents.has(e.idx) ? 'checked' : '';
            const tag = getPhaseTag(e);
            const safeIdx = Number(e.idx);
            const homeName = e.group ? cn(e.home) : translateTeam(e.home);
            const awayName = e.group ? cn(e.away) : translateTeam(e.away);
            const homeFlag = countryFlags[e.home] ? countryFlags[e.home] + ' ' : '';
            const awayFlag = countryFlags[e.away] ? ' ' + countryFlags[e.away] : '';
            const matchTitle = homeFlag + homeName + ' - ' + awayName + awayFlag;
            const sub = e.matchNr ? cityName(e.city) + ' · ' + t('match') + ' ' + e.matchNr : cityName(e.city);

            let pathClass = '';
            if (paths && e.matchNr && countryGroup) {
                const on1 = paths.first.has(e.matchNr);
                const on2 = paths.second.has(e.matchNr);
                const on3 = paths.third.has(e.matchNr);
                if (on1 && !on2) { pathClass = ' path-1e'; }
                else if (on2 && !on1) { pathClass = ' path-2e'; }
                else if (on1 && on2) { pathClass = ' path-1e'; }
                else if (on3) { pathClass = ' path-3e'; }
            }

            html += '<div class="event-card' + pathClass + '" onclick="toggleEvent(' + safeIdx + ', event)">' +
                '<input type="checkbox" ' + checked + ' data-idx="' + safeIdx + '" onclick="event.stopPropagation(); toggleEvent(' + safeIdx + ', event)">' +
                '<span class="event-time">' + escapeHTML(e.time) + '</span>' +
                '<div class="event-details">' +
                '<div class="event-title"><span class="sport-tag ' + escapeHTML(tag.cls) + '">' + escapeHTML(tag.label) + '</span> ' + escapeHTML(matchTitle) + '</div>' +
                '<div class="event-sub">' + escapeHTML(sub) + '</div>' +
                '</div>' +
                '<div class="event-buttons">' +
                '<a class="event-gcal" href="' + escapeHTML(getGCalUrl(e)) + '" target="_blank" onclick="event.stopPropagation()">Google</a>' +
                '<button class="event-ics" onclick="event.stopPropagation(); downloadSingleICS(' + safeIdx + ')">Apple / ics</button>' +
                '</div>' +
                '</div>';
        });
        html += '</div>';
    }

    if (selectedCountry && paths && paths.third.size > 0 && !activePhaseFilters.has('Groepsfase')) {
        const thirdCount = [...paths.third].filter(mn => !paths.first.has(mn) && !paths.second.has(mn)).length;
        if (thirdCount > 0) {
            html += '<div class="third-place-toggle" onclick="toggleThirdPaths()">' +
                (showThirdPaths ? t('hideThird') : t('showThird') + ' (' + thirdCount + ' ' + t('matches') + ')') +
                '</div>';
        }
    }

    container.innerHTML = html;
    updateCount();
}

function toggleThirdPaths() {
    showThirdPaths = !showThirdPaths;
    renderEvents();
}

function toggleSection(type, checked) {
    const checkboxes = document.querySelectorAll('.event-card input[type="checkbox"]');
    checkboxes.forEach(cb => {
        const idx = parseInt(cb.dataset.idx);
        const e = events[idx];
        const isGroup = !!e.group;
        if ((type === 'group' && isGroup) || (type === 'finals' && !isGroup)) {
            if (checked) selectedEvents.add(idx);
            else selectedEvents.delete(idx);
            cb.checked = checked;
        }
    });
    updateCount();
}

function switchLang(newLang) {
    lang = newLang;
    document.getElementById('langNL').classList.toggle('active', lang === 'nl');
    document.getElementById('langEN').classList.toggle('active', lang === 'en');
    document.documentElement.lang = lang;
    document.title = lang === 'nl' ? 'WK Voetbal 2026 - Agenda Tool' : 'FIFA World Cup 2026 - Calendar Tool';
    document.getElementById('pageTitle').textContent = t('title');
    document.getElementById('pageSubtitle').innerHTML = t('subtitle') + ' &mdash; by <a href="https://www.linkedin.com/in/rorik/" target="_blank" style="color:#7a8ba3;text-decoration:underline;">Rorik de Boer</a>';
    document.getElementById('labelPhase').textContent = t('phase');
    document.getElementById('labelCountry').textContent = t('country');
    updateMethodInfo();
    initFilters();
    renderEvents();
}

document.getElementById('downloadIcs').addEventListener('click', downloadICS);

initFilters();
updateMethodInfo();
selectCountry('Nederland');

const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isMobileDevice) {
    document.getElementById('methodDesktop').style.display = 'none';
    document.getElementById('methodMobile').style.display = '';
}
</script>
